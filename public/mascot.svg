<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bandit the cat">
  <!-- whiskers poking out from under the bandana -->
  <g stroke="#d8cfc0" stroke-width="1.5" stroke-linecap="round">
    <line x1="17" y1="61" x2="3" y2="57"/>
    <line x1="17" y1="65" x2="4" y2="67"/>
    <line x1="83" y1="61" x2="97" y2="57"/>
    <line x1="83" y1="65" x2="96" y2="67"/>
  </g>

  <!-- ears: black fur with a soft rim so the head still shows on dark backgrounds -->
  <path d="M18 44 L24 10 L46 30 Z" fill="#221e26" stroke="#5c5466" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M82 44 L76 10 L54 30 Z" fill="#221e26" stroke="#5c5466" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M25 35 L27.5 20 L37 30 Z" fill="#b8707e"/>
  <path d="M75 35 L72.5 20 L63 30 Z" fill="#b8707e"/>

  <!-- head -->
  <ellipse cx="50" cy="56" rx="34" ry="30" fill="#221e26" stroke="#5c5466" stroke-width="2.5"/>
  <ellipse cx="50" cy="37" rx="9" ry="3" fill="#2e2a33"/>

  <!-- scheming squint: narrow eyes, lids slanting down towards the nose, pupils slid to one side -->
  <path d="M27 46 L46 51 Q37 57.5 28.5 52 Z" fill="#d6dd3c"/>
  <path d="M73 46 L54 51 Q63 57.5 71.5 52 Z" fill="#d6dd3c"/>
  <ellipse cx="41.5" cy="52" rx="1.6" ry="3" fill="#0d0b0e"/>
  <ellipse cx="66.5" cy="51.8" rx="1.6" ry="3" fill="#0d0b0e"/>
  <g fill="none" stroke="#0d0b0e" stroke-width="3" stroke-linecap="round">
    <path d="M25.5 45.5 L47 51.3"/>
    <path d="M74.5 45.5 L53 51.3"/>
  </g>
  <!-- low, plotting brows -->
  <g fill="none" stroke="#5c5466" stroke-width="2.5" stroke-linecap="round">
    <path d="M28 40 L44 45"/>
    <path d="M72 40 L56 45"/>
  </g>

  <!-- bandit bandana over the lower face, knotted at the side -->
  <path d="M83 58 L97 51 L94 62 Z" fill="#a8322a" stroke="#0d0b0e" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M83 61 L95 71 L86 69 Z" fill="#a8322a" stroke="#0d0b0e" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M17 57 Q50 66 83 57 Q82 70 72 78 Q50 95 28 78 Q18 70 17 57 Z" fill="#a8322a" stroke="#0d0b0e" stroke-width="3" stroke-linejoin="round"/>
  <!-- nose bump and polka dots -->
  <path d="M44 63 Q50 59 56 63" fill="none" stroke="#7a2019" stroke-width="2" stroke-linecap="round"/>
  <g fill="#f6ecd2">
    <circle cx="30" cy="67" r="2"/>
    <circle cx="42" cy="74" r="2"/>
    <circle cx="58" cy="74" r="2"/>
    <circle cx="70" cy="67" r="2"/>
    <circle cx="50" cy="83" r="2"/>
  </g>
</svg>
