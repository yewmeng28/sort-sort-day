<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- chest outline: every corner rounded to match the S -->
    <clipPath id="chest">
      <path d="M124 116 H388 A28 28 0 0 1 416 144 V372 A28 28 0 0 1 388 400 H124 A28 28 0 0 1 96 372 V144 A28 28 0 0 1 124 116 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#3b2a1c"/>

  <g clip-path="url(#chest)">
    <!-- lid and body with planks -->
    <rect x="96" y="116" width="320" height="110" fill="#a06a34"/>
    <rect x="96" y="226" width="320" height="174" fill="#7a4a22"/>
    <g stroke="#55321a" stroke-width="5">
      <line x1="96" y1="171" x2="416" y2="171"/>
      <line x1="96" y1="284" x2="416" y2="284"/>
      <line x1="96" y1="342" x2="416" y2="342"/>
    </g>

    <!-- iron straps with rivets -->
    <g fill="#3a3a40" stroke="#1c1c20" stroke-width="3">
      <rect x="146" y="116" width="26" height="284"/>
      <rect x="340" y="116" width="26" height="284"/>
    </g>
    <g fill="#9a9aa6">
      <circle cx="159" cy="146" r="4"/><circle cx="159" cy="200" r="4"/>
      <circle cx="159" cy="260" r="4"/><circle cx="159" cy="314" r="4"/><circle cx="159" cy="370" r="4"/>
      <circle cx="353" cy="146" r="4"/><circle cx="353" cy="200" r="4"/>
      <circle cx="353" cy="260" r="4"/><circle cx="353" cy="314" r="4"/><circle cx="353" cy="370" r="4"/>
    </g>
  </g>

  <!-- lock plate -->
  <rect x="222" y="242" width="68" height="74" rx="6" fill="#e0b23a" stroke="#2a1d12" stroke-width="6"/>
  <circle cx="256" cy="270" r="8" fill="#2a1d12"/>
  <path d="M251 274 H261 L264 298 H248 Z" fill="#2a1d12"/>

  <!-- full silhouette in dark wood so the chest reads first -->
  <path d="M124 116 H388 A28 28 0 0 1 416 144 V372 A28 28 0 0 1 388 400 H124 A28 28 0 0 1 96 372 V144 A28 28 0 0 1 124 116 Z" fill="none" stroke="#2a1d12" stroke-width="8"/>

  <!-- gold trim that traces an S with soft bends and ends that curl down/up: top of the lid, left of the lid, the seam, right of the body, bottom -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M416 160 V144 A28 28 0 0 0 388 116 H124 A28 28 0 0 0 96 144 V198 A28 28 0 0 0 124 226 H388 A28 28 0 0 1 416 254 V372 A28 28 0 0 1 388 400 H124 A28 28 0 0 1 96 372 V326" stroke="#2a1d12" stroke-width="30"/>
    <path d="M416 160 V144 A28 28 0 0 0 388 116 H124 A28 28 0 0 0 96 144 V198 A28 28 0 0 0 124 226 H388 A28 28 0 0 1 416 254 V372 A28 28 0 0 1 388 400 H124 A28 28 0 0 1 96 372 V326" stroke="#e8b84a" stroke-width="20"/>
  </g>
</svg>
